<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <title>Reşo · Kurz innehalten</title>
    <style>
      :root { color-scheme: dark; --teal: #40c8e0; --green: #30d158; --label: #f5f5f7; --label-2: rgba(235, 235, 245, 0.62); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: #111113;
        color: var(--label);
        font-family: -apple-system, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .card {
        width: calc(100% - 28px);
        height: calc(100% - 28px);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 26px 26px 18px;
        border-radius: 26px;
        background: #1c1c1e;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        text-align: center;
      }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--teal); }
      h1 { margin: 6px 0 6px; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--label-2); font-size: 14px; line-height: 1.45; max-width: 290px; }
      .stage { position: relative; width: 250px; height: 250px; margin: 18px 0 8px; display: grid; place-items: center; }
      .stage svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      .track { fill: none; stroke: #2c2c2e; stroke-width: 6; }
      .progress { fill: none; stroke: var(--teal); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear, stroke 0.4s; }
      .glow {
        position: absolute; width: 200px; height: 200px; border-radius: 50%;
        background: radial-gradient(circle, rgba(64, 200, 224, 0.35), rgba(64, 200, 224, 0) 70%);
        transform: scale(var(--s, 0.55)); transition: transform var(--d, 1s) ease-in-out;
      }
      .circle {
        position: relative; width: 190px; height: 190px; border-radius: 50%;
        display: grid; place-content: center; gap: 2px;
        background: radial-gradient(circle at 35% 30%, #8fe3f2, #36b9d8 45%, #1f8fe0);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25) inset, 0 10px 40px rgba(64, 200, 224, 0.35);
        transform: scale(var(--s, 0.55)); transition: transform var(--d, 1s) ease-in-out, background 0.4s;
      }
      .circle strong { font-size: 24px; font-weight: 650; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.25); }
      .circle span { font-size: 13px; color: rgba(255, 255, 255, 0.9); font-variant-numeric: tabular-nums; }
      .circle.hold { animation: hold 2s ease-in-out infinite; }
      @keyframes hold { 50% { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35) inset, 0 0 60px rgba(64, 200, 224, 0.6); } }
      .done .circle { background: radial-gradient(circle at 35% 30%, #9ef0b4, #34c759 50%, #20a548); }
      .done .progress { stroke: var(--green); }
      button {
        width: 100%; border: 0; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 650; line-height: 1; cursor: pointer;
        transition: transform 0.15s, background 0.2s, opacity 0.2s;
      }
      button:active { transform: scale(0.97); }
      #primary { margin-top: auto; padding: 14px; background: var(--teal); color: #0b1f24; }
      #primary:disabled { background: #2c2c2e; color: var(--label); cursor: default; }
      .done #primary { background: var(--green); color: #fff; }
      #later { margin-top: 6px; padding: 10px; background: transparent; color: var(--label-2); font-weight: 500; }
      #later:hover { background: #2c2c2e; }
      small { margin-top: 10px; font-size: 11px; color: #6e6e73; }
      @media (prefers-reduced-motion: reduce) { .circle, .glow { transition-duration: 0.2s !important; } }
    </style>
    <script type="module" src="pause.js"></script>
  </head>
  <body>
    <main class="card" id="card">
      <span class="eyebrow">KURZ INNEHALTEN</span>
      <h1>Alles okay bei dir?</h1>
      <p id="text">Du tippst gerade sehr schnell. Lass uns kurz zusammen atmen.</p>
      <div class="stage">
        <svg viewBox="0 0 250 250" aria-hidden="true">
          <circle class="track" cx="125" cy="125" r="118"/>
          <circle class="progress" id="progress" cx="125" cy="125" r="118" stroke-dasharray="741.4" stroke-dashoffset="741.4"/>
        </svg>
        <div class="glow" id="glow"></div>
        <div class="circle" id="circle" role="timer" aria-live="polite"><strong id="phase">Bereit</strong><span id="count">30 Sekunden</span></div>
      </div>
      <button id="primary" type="button">Zusammen atmen</button>
      <button id="later" type="button">Später</button>
      <small>Erkannt an deinem Tipp-Tempo.</small>
    </main>
  </body>
</html>
