<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src http://127.0.0.1:*; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';"
    >
    <title>Reşo — You vs You</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="server-rail" aria-label="App-Bereiche">
        <div class="brand-mark" title="Reşo">R</div>
        <div class="rail-divider"></div>
        <button class="rail-item is-active" data-page="home" aria-label="Home">⌂</button>
        <button class="rail-item" data-page="timer" aria-label="Fokus">◷</button>
        <button class="rail-item" data-page="community" aria-label="Community">◎</button>
        <button class="rail-item" data-page="stats" aria-label="Analytics">▥</button>
        <div class="rail-spacer"></div>
        <button class="rail-item" data-page="settings" aria-label="Einstellungen">⚙</button>
        <div class="avatar-small">R</div>
      </aside>

      <aside class="channel-sidebar">
        <div class="workspace-title">
          <div>
            <span class="eyebrow">DEIN WORKSPACE</span>
            <h1>Reşo</h1>
          </div>
          <span class="online-dot" title="Lokal verbunden"></span>
        </div>
        <div class="section-label">DEIN ALLTAG</div>
        <nav class="channel-list" aria-label="Navigation">
          <button class="nav-link is-active" data-page="home"><span>⌂</span> Übersicht</button>
          <button class="nav-link" data-page="timer"><span>◷</span> Fokus & Pausen</button>
          <button class="nav-link" data-page="community"><span>◎</span> Community</button>
          <button class="nav-link" data-page="stats"><span>▥</span> Analytics</button>
        </nav>
        <div class="sidebar-card">
          <span class="eyebrow">DEIN MOTTO</span>
          <p>Ein Schritt nach dem anderen. Du bist auf deinem Weg.</p>
        </div>
        <button class="nav-link settings-link" data-page="settings"><span>⚙</span> Einstellungen</button>
        <div class="profile-bar">
          <div class="avatar-small">R</div>
          <div class="profile-copy">
            <strong id="sidebar-name">Dein Fortschritt</strong>
            <span>Lokal auf diesem Gerät</span>
          </div>
          <span class="online-dot"></span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="breadcrumb"><span>Reşo</span><span class="breadcrumb-separator">/</span><strong id="page-title">Übersicht</strong></div>
          <div class="topbar-actions"><button class="text-button" id="classic-view">Klassische Ansicht</button><div class="topbar-status"><span class="online-dot"></span><span id="connection-status">Verbinde lokal …</span></div></div>
        </header>
        <section id="page-content" class="page-content" aria-live="polite"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
